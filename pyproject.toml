[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "xga"
dynamic = ["version"]
description = "Python package to easily generate and analyse X-ray astronomy data products, ideal for investigating large samples."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "David J Turner", email = "djturner@umbc.edu"}]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "astropy>=6.1.2",
    "numpy>=1.26.4",
    "tqdm>=4.66.4",
    "regions>=0.9",
    "pandas>=2.2.2",
    "fitsio>=1.2.1",
    "matplotlib>=3.9.0",
    "scipy>=1.14.0",
    "pyabel>=0.9",
    "emcee>=3.1.6",
    "tabulate>=0.9.0",
    "getdist>=1.4.7",
    "exceptiongroup>=1.0.4",
    "importlib_resources~=6.5.2",
]

[project.optional-dependencies]
# These dependencies give the product classes the widest compatibility with older archived mission
#  files (uncompresspy helps decompress .Z zips) and files stored in AWS S3 buckets
wide_product_compatibility = [
    "uncompresspy>=0.4.0",
    "s3fs>=2023.4.0",
]

# Every runtime dependency of XGA
all = [
    "xga[wide_product_compatibility]",
    "rpy2>=3.6.0"
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.16.0",
    "mypy>=2.0.0",
    "bandit>=1.8.0",
    "pandas-stubs>=2.3.3.260113",
    "scipy-stubs>=1.16.3.3",
    "types-tabulate",
    "types-tqdm",
    "Sphinx==8.1.3",
    "nbsphinx",
    "sphinx_rtd_theme",
    "ipython",
    "docutils",
    "ipympl",
    "urllib3",
    "jinja2",
]

[project.urls]
"Homepage" = "http://github.com/DavidT3/XGA"
"Bug Tracker" = "http://github.com/DavidT3/XGA/issues"

[tool.setuptools]
packages = ["xga"]
include-package-data = true

[tool.setuptools.package-data]
"xga.files" = ["*"]
"xga.xspec_scripts" = ["*"]

[tool.setuptools_scm]
write_to = "xga/_version.py"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["xga"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
# Select specific rule sets
# E, W: pycodestyle
# F: Pyflakes
# I: isort (Import sorting)
# N: pep8-naming
# D: pydocstyle (Docstrings)
# UP: pyupgrade
# B: flake8-bugbear
# ANN: flake8-annotations (Type hints)
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "ANN"]

# Ignore rules that are too noisy or conflict with ruff format
ignore = [
    "D203", # one-blank-line-before-class
    "D213", # multi-line-summary-second-line
    "D401", # Docstring imperative mood (e.g. 'Generate images...', not 'Generates images...').
    "COM812", # Missing trailing comma (handled by formatter)
    "ISC001", # Implicit string concatenation (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["xga"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `lo_en: Quantity = Quantity(0.5, 'keV')`.
extend-immutable-calls = ["astropy.units.Quantity"]

[tool.mypy]
# Setting this to 3.12, despite us aiming for 3.10 in the rest of the pyproject, as it is
#  the earliest Python version we still support, because otherwise mypy is completely
#  unable to parse the numpy v2+ stubs
python_version = "3.12"
files = ["xga"]
# This stops mypy going down the rabbit hole of all other XGA files
#  that are somehow connected to the file we're changing - that is important because
#  we want to fix the problems mypy finds ones file at a time.
follow_imports = "silent"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "astropy.*",
    "numpy.*",
    "pandas.*",
    "scipy.*",
    "fitsio.*",
    "matplotlib.*",
    "regions.*",
    "tqdm.*",
    "abel.*",
    "emcee.*",
    "getdist.*"
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
targets = ["xga"]
# We are going to disable bandit's check for the use of random
#  (https://bandit.readthedocs.io/en/latest/blacklists/blacklist_calls.html#b311-random)
#  as we aren't doing any cryptography in this module
skips = ["B311"]
