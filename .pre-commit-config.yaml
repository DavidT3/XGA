repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        args: ['--maxkb=1000']
    -   id: check-ast
    -   id: check-toml

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Runs the linter and avoids ipynb files. Also, lints the pyproject toml.
      - id: ruff-check
        types_or: [ python, pyi, pyproject ]
        # Commenting this out would mean the ruff-check linter would just
        #  look for issues, but not fix them.
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]
        # This would just check the formatting, without modifying any files
        # args: [ --check ]

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
    -   id: mypy
        additional_dependencies: [types-tabulate, pandas-stubs, types-tqdm, numpy, scipy]

-   repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
    -   id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["setuptools"]
